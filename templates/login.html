<!DOCTYPE html>
<html>
<head>
    <title>login</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6601702089082053"
     crossorigin="anonymous"></script>
</head>

<body>

<h2>Create Account</h2>
<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Name"
        required
    >

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<p>
    Already have an account?
    <a href="/login">Login</a>
</p>

</body>
</html>
